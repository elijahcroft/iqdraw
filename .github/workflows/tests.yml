name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    # Ubuntu 26.04 runners have no Python 3.9 build, and 3.9 is still the
    # oldest version pyproject.toml supports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: ./run-tests.sh
      - name: Render a worked example
        run: iqdraw examples/gear-train.py -o out/gear-train.html --strict
